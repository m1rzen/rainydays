<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>RainyDays 啟動頁</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=IBM+Plex+Mono:wght@400;600&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
/* Concept: before a task starts the whole window is the navy field, and the same stripe runs at full height like a runway waiting for a launch. */
.lp{--paper:#F1EDE1;--navy:#14224A;--ink:#141B2D;--muted:#5A5F6B;--dim:#A9B3CC;--deep:#0E1A3A;
--s1:#C43D2B;--s2:#E5752A;--s3:#EFAE34;--s4:#35A7BE;--s5:#2B6CA8;
--space:"Michroma","Segoe UI",sans-serif;--sans:"Noto Sans TC","Microsoft JhengHei UI","Microsoft YaHei UI",sans-serif;--mono:"IBM Plex Mono","Cascadia Code",Consolas,monospace;
position:relative;min-height:100vh;background:var(--navy);color:var(--paper);font-family:var(--sans);font-size:15.5px;line-height:1.75;overflow:hidden;display:flex;flex-direction:column}
.lp *{box-sizing:border-box}
.lp button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.lp a{color:inherit;text-decoration:none}
.lp button:focus-visible,.lp a:focus-visible{outline:2px solid var(--s4);outline-offset:2px}
.lab{font:400 11.5px/1.4 var(--mono);letter-spacing:.04em;color:var(--dim)}
.brand{position:absolute;left:24px;top:22px;height:40px;display:flex;align-items:center;gap:10px;z-index:3}
.brand b{font:400 13.5px/1 var(--space);letter-spacing:.04em}
.sh{position:absolute;top:22px;left:214px;right:110px;height:40px;background:linear-gradient(180deg,var(--s1) 0 20%,var(--s2) 20% 40%,var(--s3) 40% 60%,var(--s4) 60% 80%,var(--s5) 80% 100%)}
.sc{position:absolute;right:40px;top:22px;width:70px;height:70px;overflow:visible}
.sv{position:absolute;right:40px;top:92px;bottom:0;width:40px;background:linear-gradient(270deg,var(--s1) 0 20%,var(--s2) 20% 40%,var(--s3) 40% 60%,var(--s4) 60% 80%,var(--s5) 80% 100%)}
.body{flex:1;padding:128px 140px 40px 214px;display:flex;flex-direction:column;gap:30px}
.body h1{margin:4px 0 0;font-size:clamp(46px,7vw,100px);line-height:1.14;font-weight:900;text-wrap:balance}
.box{max-width:820px;background:var(--paper);color:var(--ink);padding:16px 20px 12px;display:flex;flex-direction:column;gap:6px}
.box:focus-within{box-shadow:0 0 0 3px var(--s3)}
.box textarea{width:100%;min-height:62px;resize:vertical;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;border:0;outline:0;padding:0}
.box textarea::placeholder{color:var(--muted)}
.box .lab{color:var(--muted)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bar .sp{flex:1}
.start{min-width:104px;min-height:44px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--paper)!important;font-weight:700}
.ideas{display:flex;flex-wrap:wrap;gap:4px 28px;max-width:820px}
.ideas button{min-height:44px;color:var(--paper);text-decoration:underline;text-decoration-color:var(--dim);text-underline-offset:5px}
.ideas button:hover{text-decoration-color:var(--s3)}
.recent{margin:auto -140px -40px -214px;padding:22px 140px 26px 214px;background:var(--deep);display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 28px;max-width:820px}
.task{display:flex;flex-direction:column;gap:2px;min-height:44px}
.task b{font-size:15px;font-weight:700;line-height:1.5}
.task span{font:400 12px/1.5 var(--mono);color:var(--dim)}
.task span.hold{color:#FF9A66}
@media (max-width:980px){.sc,.sv{display:none}.sh{right:0}.body{padding:130px 32px 32px}.recent{margin:auto -32px -32px;padding:20px 32px}}
@media (max-width:640px){.brand{left:16px}.sh{left:178px}.body{padding:120px 16px 28px}.recent{margin:auto -16px -28px;padding:18px 16px}.grid{grid-template-columns:minmax(0,1fr)}}
</style>
</helmet>
<div class="lp">
  <div class="brand">
    <svg width="24" height="22" viewBox="0 0 24 22" aria-hidden="true"><path d="M7 1 2 21M14 1 9 21M21 1l-5 20" fill="none" stroke="#F1EDE1" stroke-width="3"></path></svg>
    <b>RAINYDAYS</b>
  </div>
  <div class="sh" aria-hidden="true"></div>
  <svg class="sc" viewBox="0 0 70 70" fill="none" stroke-width="8" aria-hidden="true">
    <path d="M-1 4H0A66 66 0 0 1 66 70V71" style="stroke: var(--s1)"></path>
    <path d="M-1 12H0A58 58 0 0 1 58 70V71" style="stroke: var(--s2)"></path>
    <path d="M-1 20H0A50 50 0 0 1 50 70V71" style="stroke: var(--s3)"></path>
    <path d="M-1 28H0A42 42 0 0 1 42 70V71" style="stroke: var(--s4)"></path>
    <path d="M-1 36H0A34 34 0 0 1 34 70V71" style="stroke: var(--s5)"></path>
  </svg>
  <div class="sv" aria-hidden="true"></div>

  <main class="body">
    <div>
      <span class="lab">待命 · 本機 Windows 已連接 · 樣例內容</span>
      <h1>今天要做什麼？</h1>
    </div>
    <div class="box">
      <label class="lab" for="lp-input">交給 RainyDays 的任務</label>
      <textarea id="lp-input" placeholder="例如：把桌面上的投標資料按項目分類，再列一份缺件清單"></textarea>
      <div class="bar">
        <span class="lab">通用助手 · Gcable-Pro-Thinking</span>
        <span class="sp"></span>
        <a class="start" href="Main.dc.html">開始</a>
      </div>
    </div>
    <div class="ideas">
      <button type="button">整理一個資料夾</button>
      <button type="button">研究主題並寫報告</button>
      <button type="button">修改一份文檔</button>
      <button type="button">分析程式專案</button>
    </div>
    <section class="recent" aria-label="最近任務">
      <span class="lab">最近任務</span>
      <div class="grid">
        <a class="task" href="Main.dc.html"><b>下載 IEM 北京錄像</b><span class="hold">HOLD · 等待你批准</span></a>
        <a class="task" href="Main.dc.html"><b>第三季銷售總結</b><span>運行中 · 2 / 5</span></a>
        <a class="task" href="Main.dc.html"><b>邑易行結構分析</b><span>已完成</span></a>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
