name: GOV-04 Merge Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gov-04-merge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gov-04-merge
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Full immutable checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up governed Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        shell: pwsh
        run: |
          npm install --global npm@11.11.0 --no-audit --no-fund
          if ((node --version) -ne 'v24.14.1') { throw 'Node version mismatch' }
          if ((npm --version) -ne '11.11.0') { throw 'npm version mismatch' }

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Bootstrap checksum-pinned models
        shell: pwsh
        run: npm run models:bootstrap

      - name: Bootstrap checksum-pinned Gitleaks
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'rainydays-gitleaks-8.30.1'
          $executable = & .\scripts\gov04\install-gitleaks.ps1 -DestinationDirectory $destination
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($executable)) { throw 'Gitleaks bootstrap failed' }
          "RAINYDAYS_GITLEAKS_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: GOV-04 fixed fault-gate self-test
        shell: pwsh
        run: npm run test:gov04:self

      - name: GOV-04 merge pipeline
        shell: pwsh
        run: node scripts/run-gov04.mjs --profile merge --evidence-dir test-results/gov04-evidence

      - name: Upload governed reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gov-04-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/gov04-self-test.json
            test-results/gov04-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned diagnostic artifact
        if: success() && hashFiles('test-results/gov04-evidence/unsigned/*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UNSIGNED-UNTRUSTED-DO-NOT-DISTRIBUTE-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/gov04-evidence/unsigned/
          if-no-files-found: error
          retention-days: 7
